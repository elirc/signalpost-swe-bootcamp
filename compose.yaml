services:
  postgres:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_DB: signalpost
      POSTGRES_USER: signalpost
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalpost -d signalpost"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
